x-backend-environment: &backend-environment
  NODE_ENV: development
  APP_RUNTIME_ORIGIN: local-docker
  APP_BUILD_SHA: ${LOCAL_BUILD_SHA:-local}
  APP_BUILD_DIRTY: ${LOCAL_BUILD_DIRTY:-true}
  SUPABASE_URL: http://host.docker.internal:54321
  SUPABASE_ANON_KEY: ${LOCAL_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${LOCAL_SUPABASE_SERVICE_ROLE_KEY}
  DATABASE_URL: ${LOCAL_DATABASE_URL}
  ALPACA_API_KEY: ${ALPACA_API_KEY:-local-paper-key}
  ALPACA_API_SECRET: ${ALPACA_API_SECRET:-local-paper-secret}
  ALPACA_TRADING_MODE: paper
  CORS_ORIGIN: http://localhost:3000
  SANDBOX_MAX_CAPITAL_PCT: ${SANDBOX_MAX_CAPITAL_PCT:-0.05}
  SANDBOX_MAX_ACTIVE_RUNS_PER_MEMBER: ${SANDBOX_MAX_ACTIVE_RUNS_PER_MEMBER:-2}
  SANDBOX_RUN_TTL_HOURS: ${SANDBOX_RUN_TTL_HOURS:-24}

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: development
  volumes:
    - ./backend:/app
    - backend_node_modules:/app/node_modules
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: *backend-environment
  restart: unless-stopped
  stop_grace_period: 60s

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
      NEXT_PUBLIC_BACKTEST_API_BASE_URL: http://localhost:8082/api
      NEXT_PUBLIC_LIVE_API_BASE_URL: http://localhost:8081/api
      NEXT_PUBLIC_ENABLE_WEBSOCKET: "true"
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8080
      NEXT_PUBLIC_APP_NAME: SHPE Capital Trading Platform (Local)
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${LOCAL_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped

  api:
    <<: *backend-service
    command: ["npm", "run", "dev:api"]
    environment:
      <<: *backend-environment
      PORT: "8082"
    ports:
      - "8082:8082"

  paper-trading:
    <<: *backend-service
    command: ["npm", "run", "dev:paper-trading"]
    environment:
      <<: *backend-environment
      PORT: "8080"
    ports:
      - "8080:8080"

  backtest-worker:
    <<: *backend-service
    command: ["npm", "run", "dev:worker"]
    cpus: 1.0
    healthcheck:
      disable: true

volumes:
  backend_node_modules:
  frontend_node_modules:
