# TODO(security): replace SSH with GitHub OIDC + AWS SSM Run Command before real
# money or the club's Alpaca account is involved. Today the scp/ssh steps below
# need port 22 open to 0.0.0.0/0 (GitHub runner IPs are not fixed) and a
# long-lived private key in the EC2_SSH_KEY secret. Target state:
#   - IAM OIDC identity provider for GitHub + a role assumable only by this
#     repo's main branch (aws-actions/configure-aws-credentials), allowed
#     ssm:SendCommand on this instance
#   - instance profile with AmazonSSMManagedInstanceCore (SSM agent is preinstalled)
#   - ship docker-compose.prod.yml / Caddyfile via S3 or the image, run the
#     rollout script via SSM instead of scp/ssh, then close port 22 and drop
#     the EC2_HOST and EC2_SSH_KEY secrets
# See docs/guides/deployment.md ("Hardening").

name: Deploy

# Runs only after CI has passed on main (or manually). Builds the backend image,
# pushes it to GHCR tagged with the commit SHA, then tells the EC2 box to pull
# that exact tag. Rollback = re-run this workflow on an older commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        if: vars.DEPLOY_PLATFORM == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: server
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose + Caddy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile
          target: /home/ubuntu/app
          strip_components: 1

      - name: Roll out
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,SHA
          script_stop: true
          script: |
            cd ~/app
            test -f .env || { echo "~/app/.env missing"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            PREV=$(grep '^IMAGE_TAG=' .deploy.env 2>/dev/null | cut -d= -f2 || true)
            printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$SHA" > .deploy.env
            dc() { docker compose --env-file .deploy.env -f docker-compose.prod.yml "$@"; }

            dc pull
            dc up -d --remove-orphans

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/health >/dev/null && curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                echo "healthy on $SHA"; docker image prune -f >/dev/null; exit 0
              fi
              sleep 2
            done

            echo "health check failed on $SHA"; dc logs --tail=80 api paper-trading backtest-worker
            if [ -n "$PREV" ]; then
              echo "rolling back to $PREV"
              printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$PREV" > .deploy.env
              dc up -d --remove-orphans
            fi
            exit 1
