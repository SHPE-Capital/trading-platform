# Production stack on EC2. Images are built and pushed to GHCR by
# .github/workflows/deploy.yml; this file only pulls them. Copied to
# ~/app/ on the server by the workflow. Run with:
#   docker compose --env-file .deploy.env -f docker-compose.prod.yml <cmd>
#
# TODO(security): rollout currently arrives over SSH; see the OIDC + SSM note in
# .github/workflows/deploy.yml and docs/guides/deployment.md.
#
# real-trading is intentionally absent. Adding it is its own decision.
# Backend ports bind to localhost only; Caddy is the sole public entry.

x-backend: &backend
  image: ${IMAGE}:${IMAGE_TAG}
  env_file: ./.env
  restart: unless-stopped
  stop_grace_period: 60s
  # Bar, quote and trade cache (BAR_CACHE=file), shared by every backend
  # process and kept across deploys.
  volumes:
    - market_data:/data/marketdata
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  api:
    <<: *backend
    command: ["node", "dist/index.js"]
    environment:
      PORT: "8082"
      APP_BUILD_SHA: ${IMAGE_TAG}
      APP_BUILD_DIRTY: "false"
      MARKET_DATA_DIR: /data/marketdata
    ports:
      - "127.0.0.1:8082:8082"

  paper-trading:
    <<: *backend
    command: ["node", "dist/runtime/paper-trading.js"]
    environment:
      PORT: "8080"
      APP_BUILD_SHA: ${IMAGE_TAG}
      APP_BUILD_DIRTY: "false"
      MARKET_DATA_DIR: /data/marketdata
    ports:
      - "127.0.0.1:8080:8080"

  backtest-worker:
    <<: *backend
    command: ["node", "dist/runtime/backtestWorker.js"]
    environment:
      APP_BUILD_SHA: ${IMAGE_TAG}
      APP_BUILD_DIRTY: "false"
      MARKET_DATA_DIR: /data/marketdata
      # Fail a runaway backtest inside Node before the container limit bites.
      NODE_OPTIONS: --max-old-space-size=640
    # Live trading comes first. The worker gets a quarter of paper trading's CPU
    # weight when both are busy, a memory cap, and is the kernel's first choice
    # if the box runs out of memory — never the paper-trading process.
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 768m
    memswap_limit: 1g
    oom_score_adj: 500
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - paper-trading

volumes:
  market_data:
  caddy_data:
  caddy_config:
